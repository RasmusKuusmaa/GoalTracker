[project]
name = "goal-tracker-backend"
version = "0.1.0"
description = "FastAPI backend for Goal Tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2,<3",
    "alembic",
    "psycopg[binary]",
    "pydantic>=2,<3",
    "pydantic-settings",
    "passlib[bcrypt]",
    "pyjwt",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
